<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Main address: sir.hamzapatel.co.in. Firebase can't redirect its own
         web.app / firebaseapp.com addresses, so old links hop here first,
         before anything else (including Analytics) loads. -->
    <script>
      (function () {
        var MAIN = "https://sir.hamzapatel.co.in";
        var host = location.hostname;
        if (host === "panvel-sir-2026.web.app" || host === "panvel-sir-2026.firebaseapp.com") {
          location.replace(MAIN + location.pathname + location.search + location.hash);
          return;
        }
        // Tell search engines which address is the real one for this page.
        var link = document.createElement("link");
        link.rel = "canonical";
        link.href = MAIN + location.pathname;
        document.head.appendChild(link);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SIR Panvel — search the Panvel (AC 188) Special Intensive Revision 2026 Draft, Final Draft and ASDD voter lists by name, EPIC or Part." />
    <!-- Speed: open the API connection while the page loads, so the first search starts sooner. -->
    <link rel="preconnect" href="https://panvel-sir-api.panvel-sir.workers.dev" crossorigin />
    <!-- Inter font served from this site (English subset, ~47 KB): no Google Fonts round trips. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/inter-latin-var.woff2") format("woff2");
      }
    </style>
    <title>Panvel SIR 2026 — Voter List Search Portal</title>

    <!-- Google Analytics 4: same ID as the live Firebase site (v3.1.6),
         so visitor history continues in the same property.
         Loaded after the page has shown, so it never delays the first paint. -->
    <script>
      // Not on the private admin Worker (*.workers.dev).
      if (!location.hostname.endsWith(".workers.dev")) {
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-Z0GBZG49L3");
      window.addEventListener("load", function () {
        var load = function () {
          var script = document.createElement("script");
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-Z0GBZG49L3";
          document.head.appendChild(script);
        };
        if ("requestIdleCallback" in window) requestIdleCallback(load, { timeout: 3000 });
        else setTimeout(load, 1500);
      });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
